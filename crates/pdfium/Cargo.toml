[package]
name = "pdfium"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# Thread-local counters of hot PDFium calls, read by tests through
# `pdfium::call_count`.
call-count = []

[dependencies]
pdfium-sys = { path = "../pdfium-sys" }

[build-dependencies]
build-support = { path = "../build-support" }

[dev-dependencies]
test-support = { path = "../test-support" }
