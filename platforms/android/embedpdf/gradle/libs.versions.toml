# Every version the Android build uses. Modules refer to these by alias, so a
# bump is one line here.
[versions]
# AGP 9 compiles Kotlin itself; the Kotlin plugin below only raises the
# compiler it brings (2.2.10) to the version the rest of the repository uses.
agp = "9.4.1"
kotlin = "2.2.21"
jna = "5.14.0"
coroutines = "1.10.2"
junit = "4.13.2"
androidx-test-junit = "1.2.1"
androidx-test-runner = "1.6.2"

[libraries]
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
