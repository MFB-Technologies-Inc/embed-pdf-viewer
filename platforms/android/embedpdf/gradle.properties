android.useAndroidX=true
# The generated Kotlin for every viewer host component compiles as one
# module and exceeds the default heaps. These apply to this build only;
# gradle.properties does not travel with the published AAR.
org.gradle.jvmargs=-Xmx3g
kotlin.daemon.jvmargs=-Xmx3g
# The prebuilt engine this checkout expects, android-engine-<hash of
# platforms/android/android-engine-hash.sh>. check-android-engine.sh fails
# when it differs from what the tree would build. embedpdf-bindings publishes
# as 0.0.0-engine.<hash> of this pin.
embedpdf.engineRelease=android-engine-38c87b4fd72791c8
# The version of embedpdf, embedpdf-javascript, embedpdf-models and
# embedpdf-compose. The release workflow passes its own with
# -Pembedpdf.version; this default marks a local build.
embedpdf.version=0.0.0-local
