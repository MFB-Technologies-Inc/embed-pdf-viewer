<style>
/* Layout: a header of facts, one row of controls, then small multiples: one chart per report row,

:root {
  --plane: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --band: #efeee8;
  --series-1: #2a78d6; --series-2: #eb6834; --ref: #898781;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --band: #242422;
    --series-1: #3987e5; --series-2: #d95926; --ref: #898781; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plane: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --band: #242422;
  --series-1: #3987e5; --series-2: #d95926; --ref: #898781; color-scheme: dark;
}
body { margin: 0; background: var(--plane); color: var(--ink); font: 14px/1.45 var(--sans); }
.page { max-width: 1500px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 24px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; margin: 36px 0 0; }
h3 { font-size: 13px; margin: 22px 0 10px; color: var(--ink-2); font-weight: 600; font-family: var(--mono); }
h3 span, h2 span { color: var(--muted); font-weight: 400; font-family: var(--sans); font-size: 13px; }
.lede { max-width: 72ch; color: var(--ink-2); margin: 0; }
.facts { color: var(--muted); margin: 8px 0 0; font-size: 13px; }
code, .mono { font-family: var(--mono); font-size: 0.93em; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin-top: 22px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group > span { color: var(--muted); font-size: 12px; margin-right: 2px; }
button { font: 13px var(--sans); color: var(--ink-2); background: transparent; border: 1px solid var(--axis);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { color: var(--ink); border-color: var(--muted); }
button[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; color: var(--ink-2); font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { flex: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px 8px; min-width: 0; position: relative; }
.card header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; }
.card h4 { margin: 0; font: 600 13px var(--mono); overflow-wrap: anywhere; }
.latest { display: flex; gap: 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink); }
.latest span { display: inline-flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.note { color: var(--muted); font-size: 11.5px; margin: 1px 0 0; min-height: 1.4em; }
.card svg.chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
.card svg text { font: 10.5px var(--sans); fill: var(--muted); font-variant-numeric: tabular-nums; }
details { font-size: 12px; color: var(--ink-2); }
summary { cursor: pointer; color: var(--muted); width: fit-content; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
th, td { text-align: right; padding: 2px 8px 2px 0; border-bottom: 1px solid var(--grid); }
th { color: var(--muted); font-weight: 500; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
#tip { position: fixed; z-index: 5; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--axis); border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.5;
  max-width: min(320px, calc(100vw - 24px)); box-shadow: 0 4px 14px rgb(0 0 0 / 0.14); }
#tip b { font-weight: 600; }
#tip .sub { color: var(--ink-2); }
#tip .dim { color: var(--muted); overflow-wrap: anywhere; }
.empty { margin-top: 32px; padding: 20px; border: 1px dashed var(--axis); border-radius: 8px; color: var(--ink-2); max-width: 72ch; }
</style>

      for (const v of [...row.values].sort((a, b) => points[a.point].t - points[b.point].t)) {
        const p = points[v.point];
        const cells = [p.sha.slice(0, 9), day(p.t), fmtRel(row, v.rel), fmtRel(row, v.lo), fmtRel(row, v.hi), fmtAbs(row.unit, v.median), fmtAbs(row.unit, v.ref)];
        table.append(el('tr', {}, ...cells.map((c, i) => el('td', { class: i === 0 ? 'mono' : '', text: c }))));
      }
      details.append(el('div', { class: 'scroll' }, table));
    });

    return el('article', { class: 'card' }, el('header', {}, el('h4', { text: title }), latest), el('p', { class: 'note', text: note }), svg, details);
  }

  function render() {
    tip.hidden = true;
    const root = document.getElementById('charts');
    root.replaceChildren();
    for (const [direction, heading] of [['lower', 'Lower is better'], ['higher', 'Higher is better']]) {
      const rows = DATA.rows.filter((r) => r.better === direction && (state.flow === 'all' || r.flow === state.flow));
      if (!rows.length) continue;
      root.append(el('h2', {}, heading, ' ', el('span', { text: `${rows.length} rows` })));
      for (const flow of flows) {
        const mine = rows.filter((r) => r.flow === flow);
        if (!mine.length) continue;
        root.append(el('h3', { text: flow }), el('div', { class: 'grid' }, ...mine.map(card)));
      }
    }
  }
  render();
}

if (DATA && DATA.points.length) build();
else {
  document.getElementById('charts').append(
    el('p', { class: 'empty', text: 'No run is recorded yet. Record one with scripts/history-record.mjs, then run scripts/history-chart.mjs.' }),
  );
}
</script>
