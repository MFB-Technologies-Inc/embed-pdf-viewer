name: release-train

# One dispatch releases everything a commit of this branch ships, all as
# prereleases on this repo: the PDFium runtime, the wasm payload and the Apple
# engine, then the Swift package, the Rust viewer bundle and the C# engine.
# It also redeploys the hosted demo, examples/rust-kernel-eval.
#
#   t0          preflight, the three slice groups and the .NET package start
#               together.
#   runtime     needs the five runtime slices (slices-runtime, slices-eh).
#   payload     needs the wasm32-eh slice.
#   apple       needs the four Apple slices.
#   (these three run their workflow's build stage: nothing is published)
#   viewer      needs payload. It builds from the payload-wasm32 artifact when
#               payload built a new payload, and fetches the released one
#               when payload found it already out.
#   summarize   needs every job above, so it starts once everything the run
#               publishes is built and tested. Its step summary is what the
#               approval is for: each release's tag, title, target commit and
#               assets with their size and SHA-256, and the manifest diffs pin
#               will commit.
#   approve     needs summarize: the run's one approval, under the release
#               environment. GitHub's approval dialog names only the
#               environment, and a gated job's steps don't run until it is
#               approved, so summarize, not approve, writes the summary.
#   runtime-publish, payload-publish, apple-publish
#               need approve: their workflow's publish stage, on the build
#               stage's artifacts and outputs.
#   viewer-release, dotnet-release
#               need approve. They tag the dispatched commit (github.sha),
#               the one their files were built from and name: the bundle's
#               buildInfo.commit and the .NET provenance record git rev-parse
#               HEAD. They don't wait for pin.
#   deploy-demo needs approve: deploys viewer's build of the demo site to its
#               Cloudflare Worker, on every real run.
#   pin         needs the three publishes: commits the Apple manifests
#               pinned to the engine release and pushes it to this branch.
#   swift-release   tags the pin commit: the Swift package is its manifests.
#
# Nothing publishes before approve: preflight runs
# scripts/release/check-release-gate.py, which fails the run when a job that
# publishes or can write contents doesn't need approve, directly or through
# another job, when one could run after approve fails (an always() or
# !cancelled() without needs.approve.result == 'success'), or when any job
# but approve names an environment.
#
# runtime, payload and apple also wait for preflight, so a bad input stops the
# train before it builds anything long. Every job after a reusable workflow
# skips what is already out, so "Re-run failed jobs" picks up where a failed
# run stopped. A re-run that starts after approve doesn't ask again. Once pin has pushed, don't use "Re-run all jobs": pin commits on
# github.sha again and its push fails as non-fast-forward. Dispatch a fresh
# run from the branch tip instead.
#
# dry_run builds and tests everything, writes summarize's summary, runs
# approve with no environment, and prints each push, tag and release command
# instead of running it. The pin commit is made and shown but not
# pushed, so the Swift release would name the dispatched commit too. Preflight
# only warns about missing notes and existing tags on a dry run.

on:
  workflow_dispatch:
    inputs:
      swift_version:
        description: Swift package tag, 0.0.0-swift.<n>. docs/releases/<swift_version>.md holds its notes.
        required: true
        type: string
      viewer_version:
        description: Rust viewer bundle version, 0.0.0-preview.<n>, as packages/rust-viewer-bundle/package.json has it. docs/releases/rust-viewer-<viewer_version>.md holds its notes.
        required: true
        type: string
      dry_run:
        description: Build and test everything, print every push, tag and release command instead of running it.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-train
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_REPO: ${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # GET repos/{repo}/environments/{name} needs actions: read.
      actions: read
    # For summarize.
    outputs:
      swift_state: ${{ steps.releases.outputs.swift }}
      viewer_state: ${{ steps.releases.outputs.viewer }}
      dotnet_state: ${{ steps.releases.outputs.dotnet }}
      dotnet_tag: ${{ steps.releases.outputs.dotnet_tag }}
    env:
      SWIFT_VERSION: ${{ inputs.swift_version }}
      VIEWER_VERSION: ${{ inputs.viewer_version }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      # Whether deploy-demo's secrets are set; their values stay with it.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before anything else: every job that publishes waits for approve.
      # The check's own tests run first, on copies of these workflows.
      - name: Check the release gate
        run: |
          python3 scripts/release/check-release-gate.test.py
          python3 scripts/release/check-release-gate.py .github/workflows/release-train.yml

      # The release environment's reviewers are the only gate before a real
      # run publishes. A job that names a missing environment makes it with
      # no rules, so the GITHUB_TOKEN release jobs would tag and publish
      # unapproved. A dry run names no environment.
      - name: Check the release environment
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            echo "dry run: not checking the release environment's reviewers"
            exit 0
          fi
          if ! env_json=$(gh api "repos/$GH_REPO/environments/release" 2>&1); then
            echo "::error::couldn't read the release environment on $GH_REPO; create it with a required-reviewers rule before a real run: $(tr '\n' ' ' <<<"$env_json")"
            exit 1
          fi
          reviewers=$(jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' <<<"$env_json")
          if [[ "$reviewers" -eq 0 ]]; then
            echo "::error::the release environment on $GH_REPO has no required-reviewers rule; add one before a real run"
            exit 1
          fi
          echo "release environment: $reviewers required-reviewers rule(s)"

      - name: Check the inputs
        run: |
          status=0
          err() { echo "::error::$*"; status=1; }
          # A dry run can go ahead without the notes; a real run can't.
          if [[ "$DRY_RUN" == true ]]; then soft() { echo "::warning::$*"; }; else soft() { err "$@"; }; fi
          # pin pushes its commit to the dispatched branch.
          [[ "$REF_TYPE" == branch ]] || err "dispatch the train from a branch, not the $REF_TYPE $REF_NAME"
          [[ "$SWIFT_VERSION" =~ ^0\.0\.0-swift\.[0-9]+$ ]] || err "swift_version must look like 0.0.0-swift.8, got '$SWIFT_VERSION'"
          [[ "$VIEWER_VERSION" =~ ^0\.0\.0-preview\.[0-9]+$ ]] || err "viewer_version must look like 0.0.0-preview.4, got '$VIEWER_VERSION'"
          for notes in "docs/releases/$SWIFT_VERSION.md" "docs/releases/rust-viewer-$VIEWER_VERSION.md" docs/releases/dotnet-engine.md; do
            [[ -s "$notes" ]] || soft "no release notes at $notes; write them and commit before dispatching"
          done
          [[ "$HAS_CLOUDFLARE" == true ]] || soft "the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets must both be set for deploy-demo; see docs/releases/README.md"
          have=$(jq -r .version packages/rust-viewer-bundle/package.json)
          [[ "$have" == "$VIEWER_VERSION" ]] || err "packages/rust-viewer-bundle/package.json is $have, viewer_version is $VIEWER_VERSION"
          exit "$status"

      # A tag with no release, a draft or a partial release stops a real run
      # here and is a warning on a dry run; a complete release is skipped by
      # its release job. The .NET tag names the dispatched commit, which its
      # release tags.
      - name: Check the Swift, viewer and .NET releases
        id: releases
        run: |
          status=0
          check() {
            local key=$1 state err
            shift
            err=$(mktemp)
            if state=$(bash scripts/release/github-release.sh check "$@" 2>"$err"); then
              echo "$key=$state" >> "$GITHUB_OUTPUT"
            else
              # One annotation: gh's own stderr can run to several lines.
              msg=$(sed 's/^::error:://' "$err" | tr '\n' ' ')
              if [[ "$DRY_RUN" == true ]]; then
                echo "::warning::$msg"
              else
                echo "::error::$msg"
                status=1
              fi
              echo "$key=blocked" >> "$GITHUB_OUTPUT"
            fi
            rm -f "$err"
          }
          package=EmbedPDF.Engine.0.0.0-local
          dotnet_tag="dotnet-engine-0.0.0-local-${GITHUB_SHA:0:12}"
          echo "dotnet_tag=$dotnet_tag" >> "$GITHUB_OUTPUT"
          check swift "$SWIFT_VERSION"
          check viewer "rust-viewer-$VIEWER_VERSION" "mfb-embedpdf-rust-viewer-$VIEWER_VERSION.tgz"
          dotnet_assets=()
          for rid in linux-arm64 linux-x64 osx-arm64 win-x64; do
            dotnet_assets+=("$package.$rid.nupkg" "$package.$rid.nupkg.sha256" "$package.$rid.provenance.json" "$package.validation.$rid.json")
          done
          check dotnet "$dotnet_tag" "${dotnet_assets[@]}" EmbedPDF-CSharp-Existing-App.md
          exit "$status"

      # For the summary only: the reusable workflows compute these again.
      - name: Summarize
        env:
          SWIFT_STATE: ${{ steps.releases.outputs.swift }}
          VIEWER_STATE: ${{ steps.releases.outputs.viewer }}
          DOTNET_STATE: ${{ steps.releases.outputs.dotnet }}
        run: |
          runtime_sha=$(git ls-tree HEAD packages/engine/runtime/runtime-src | awk '{print $3}')
          payload_tag="runtime-payloads-$(bash packages/engine/runtime/scripts/runtime-payload-hash.sh)"
          apple_tag="apple-engine-$(bash platforms/apple/apple-engine-hash.sh)"
          on_release_repo() {
            local view
            if view=$(gh release view "$1" -R "$RELEASE_REPO" --json isDraft 2>&1); then
              jq -r 'if .isDraft then "draft" else "released" end' <<<"$view"
            elif grep -qi 'release not found' <<<"$view"; then
              echo "not released"
            else
              echo "unknown"
            fi
          }
          {
            echo "## Release train at \`${GITHUB_SHA:0:9}\` on \`$REF_NAME\`$([[ "$DRY_RUN" == true ]] && echo ' (dry run)')"
            echo
            echo "| Release | Tag | State |"
            echo "| --- | --- | --- |"
            echo "| PDFium runtime | \`runtime-$runtime_sha\` | $(on_release_repo "runtime-$runtime_sha") on $RELEASE_REPO |"
            echo "| wasm payload | \`$payload_tag\` | $(on_release_repo "$payload_tag") on $RELEASE_REPO |"
            echo "| Apple engine | \`$apple_tag\` | $(on_release_repo "$apple_tag") on $RELEASE_REPO |"
            echo "| Swift package | \`$SWIFT_VERSION\` | $SWIFT_STATE |"
            echo "| Rust viewer bundle | \`rust-viewer-$VIEWER_VERSION\` | $VIEWER_STATE |"
            echo "| C# engine | \`dotnet-engine-0.0.0-local-${GITHUB_SHA:0:12}\` | $DOTNET_STATE |"
            if [[ "$DRY_RUN" == true ]]; then
              echo
              echo "Dry run: the \`release\` environment and its required reviewers were not checked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  slices-apple:
    name: release-fork-slices.yml (apple)
    uses: ./.github/workflows/release-fork-slices.yml
    with:
      targets: '["ios-arm64","ios-sim-arm64","darwin-static-arm64","darwin-static-x64"]'

  slices-eh:
    name: release-fork-slices.yml (wasm32-eh)
    uses: ./.github/workflows/release-fork-slices.yml
    with:
      targets: '["wasm32-eh"]'

  slices-runtime:
    name: release-fork-slices.yml (runtime)
    uses: ./.github/workflows/release-fork-slices.yml
    with:
      targets: '["linux-arm64","android-arm64","android-x64","wasm32"]'

  dotnet:
    name: release-dotnet.yml
    uses: ./.github/workflows/release-dotnet.yml
    with:
      dry_run: ${{ inputs.dry_run }}

  # Its five archives: four from slices-runtime, wasm32-eh from slices-eh.
  # runtime, payload and apple and their publish calls grant contents: write
  # so the workflows' publish jobs can ask for it: GitHub holds a called
  # workflow's job permissions to its caller's whether or not the job runs.
  # Only the publish jobs ask for it, and they run only in stage publish;
  # every other job stays at contents: read.
  runtime:
    name: release-runtime.yml (build)
    needs: [preflight, slices-runtime, slices-eh]
    uses: ./.github/workflows/release-runtime.yml
    permissions:
      contents: write
    with:
      runtime_sha: ${{ needs.slices-runtime.outputs.runtime_sha }}
      dry_run: ${{ inputs.dry_run }}

  payload:
    name: release-payload.yml (build)
    needs: [preflight, slices-eh]
    uses: ./.github/workflows/release-payload.yml
    permissions:
      contents: write
    with:
      dry_run: ${{ inputs.dry_run }}

  apple:
    name: release-apple.yml (build)
    needs: [preflight, slices-apple]
    uses: ./.github/workflows/release-apple.yml
    permissions:
      contents: write
    with:
      dry_run: ${{ inputs.dry_run }}

  # A new payload is not released until after approve, which waits for this
  # build, so the build uses payload-wasm32. A payload already out is
  # fetched.
  viewer:
    name: release-rust-viewer.yml
    needs: payload
    uses: ./.github/workflows/release-rust-viewer.yml
    with:
      version: ${{ inputs.viewer_version }}
      ref: ${{ github.sha }}
      payload_artifact: ${{ needs.payload.outputs.published == 'false' && 'payload-wasm32' || '' }}

  # Reads only: every artifact the run publishes, and the manifests pin will
  # commit, which it pins in its own checkout with the publish script's
  # pinEngine. Written on dry runs too.
  summarize:
    needs: [preflight, slices-apple, slices-eh, slices-runtime, dotnet, runtime, payload, apple, viewer]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      GH_REPO: ${{ github.repository }}
      SWIFT_VERSION: ${{ inputs.swift_version }}
      VIEWER_VERSION: ${{ inputs.viewer_version }}
      SWIFT_STATE: ${{ needs.preflight.outputs.swift_state }}
      VIEWER_STATE: ${{ needs.preflight.outputs.viewer_state }}
      DOTNET_STATE: ${{ needs.preflight.outputs.dotnet_state }}
      DOTNET_TAG: ${{ needs.preflight.outputs.dotnet_tag }}
      RUNTIME_SHA: ${{ needs.slices-runtime.outputs.runtime_sha }}
      RUNTIME_TAG: ${{ needs.runtime.outputs.tag }}
      RUNTIME_PUBLISHED: ${{ needs.runtime.outputs.published }}
      PAYLOAD_TAG: ${{ needs.payload.outputs.payload_tag }}
      PAYLOAD_PUBLISHED: ${{ needs.payload.outputs.published }}
      APPLE_STATE: ${{ needs.apple.outputs.state }}
      APPLE_TAG: ${{ needs.apple.outputs.apple_tag }}
      APPLE_CHECKSUM: ${{ needs.apple.outputs.checksum }}
      PACKAGE: EmbedPDF.Engine.0.0.0-local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # pinEngine uses Node's built-ins only.
      - uses: actions/setup-node@v7
        if: needs.apple.outputs.state != 'current'
        with:
          node-version: 26

      - uses: actions/download-artifact@v8
        if: needs.runtime.outputs.published == 'false'
        with:
          name: runtime-release
          path: ${{ runner.temp }}/runtime-release

      - uses: actions/download-artifact@v8
        if: needs.payload.outputs.published == 'false'
        with:
          name: payload-release
          path: ${{ runner.temp }}/payload-release

      - uses: actions/download-artifact@v8
        if: needs.apple.outputs.state == 'build'
        with:
          name: apple-xcframework
          path: ${{ runner.temp }}/apple-xcframework

      - uses: actions/download-artifact@v8
        with:
          name: rust-viewer-tarball
          path: ${{ runner.temp }}/rust-viewer-tarball

      - uses: actions/download-artifact@v8
        with:
          pattern: dotnet-release-*
          merge-multiple: true
          path: ${{ runner.temp }}/dotnet-release

      # The titles, targets and asset lists are the ones each publish job
      # passes to gh. A release its job will skip as already out is named
      # as such.
      - name: Summarize the releases
        run: |
          S=scripts/release/release-summary.sh
          T=$RUNNER_TEMP
          out() { printf '## %s\n\n%s is already released; its job skips it.\n\n' "$1" "\`$2\`"; }
          {
            echo "# Release train at \`${GITHUB_SHA:0:9}\` on \`$GITHUB_REF_NAME\`$([[ "$DRY_RUN" == true ]] && echo ' (dry run)')"
            echo
            if [[ "$DRY_RUN" == true ]]; then
              echo "Dry run: approve has no environment, and each publish job prints its commands instead of running them."
            else
              echo "Approving the release environment for approve publishes everything below."
            fi
            echo

            if [[ "$RUNTIME_PUBLISHED" == false ]]; then
              bash "$S" release "$RUNTIME_TAG" "EmbedPDF PDF Runtime $RUNTIME_SHA" "$GITHUB_SHA" \
                "$T"/runtime-release/assets/*.tar.gz "$T/runtime-release/assets/pdf-runtime-build.generated.json"
            else
              out "PDFium runtime" "$RUNTIME_TAG"
            fi

            if [[ "$PAYLOAD_PUBLISHED" == false ]]; then
              a=$T/payload-release/engine-runtime-payload-wasm32.tar.gz
              bash "$S" release "$PAYLOAD_TAG" "$PAYLOAD_TAG" "$(jq -r .head "$a.json")" "$a" "$a.sha256"
            else
              out "wasm payload" "$PAYLOAD_TAG"
            fi

            if [[ "$APPLE_STATE" == build ]]; then
              zip=$T/apple-xcframework/EmbedPDFBindings.xcframework.zip
              # The .sha256 asset --stage publish writes beside the zip.
              sums=$T/apple-sha256/EmbedPDFBindings.xcframework.zip.sha256
              mkdir -p "${sums%/*}"
              printf '%s  %s\n' "$APPLE_CHECKSUM" EmbedPDFBindings.xcframework.zip > "$sums"
              bash "$S" release "$APPLE_TAG" "$APPLE_TAG" "$(jq -r .head "$zip.json")" "$zip" "$sums"
            else
              out "Apple engine" "$APPLE_TAG"
            fi

            # What pin commits: the manifests pinned as the publish stage or
            # the build stage pinned them.
            if [[ "$APPLE_STATE" != current ]]; then
              EMBEDPDF_RELEASE_REPO=$GH_REPO TAG=$APPLE_TAG CHECKSUM=$APPLE_CHECKSUM node --input-type=module -e '
                import { pinEngine } from "./scripts/publish-engine-payload.mjs";
                pinEngine(process.env.TAG, process.env.CHECKSUM);' >&2
            fi
            bash "$S" pin "$APPLE_TAG"

            if [[ "$SWIFT_STATE" == complete ]]; then
              out "Swift package $SWIFT_VERSION" "$SWIFT_VERSION"
            else
              # A dry run doesn't push the pin commit, and a current engine
              # makes none, so the tag names the dispatched commit.
              target=$GITHUB_SHA
              if [[ "$DRY_RUN" != true && "$APPLE_STATE" != current ]]; then
                target="the pin commit above"
              fi
              bash "$S" release "$SWIFT_VERSION" "Swift package $SWIFT_VERSION" "$target"
            fi

            if [[ "$VIEWER_STATE" == complete ]]; then
              out "Rust viewer bundle $VIEWER_VERSION" "rust-viewer-$VIEWER_VERSION"
            else
              bash "$S" release "rust-viewer-$VIEWER_VERSION" "Rust viewer bundle $VIEWER_VERSION" "$GITHUB_SHA" \
                "$T/rust-viewer-tarball/mfb-embedpdf-rust-viewer-$VIEWER_VERSION.tgz"
            fi

            if [[ "$DOTNET_STATE" == complete ]]; then
              out "C# engine 0.0.0-local (${GITHUB_SHA:0:9})" "$DOTNET_TAG"
            else
              # Rendered as dotnet-release renders it, from the same inputs.
              R=$T/dotnet-release
              guide=$T/dotnet-guide/EmbedPDF-CSharp-Existing-App.md
              mkdir -p "${guide%/*}"
              bash platforms/dotnet/packaging/render-guide.sh "$R/EmbedPDF-CSharp-Existing-App.md.in" "$R/guide-facts.json" \
                "$GH_REPO" "$DOTNET_TAG" "$GITHUB_SHA" "$guide" >&2
              assets=()
              for rid in linux-arm64 linux-x64 osx-arm64 win-x64; do
                assets+=("$R/$PACKAGE.$rid.nupkg" "$R/$PACKAGE.$rid.nupkg.sha256" "$R/$PACKAGE.$rid.provenance.json" "$R/$PACKAGE.validation.$rid.json")
              done
              bash "$S" release "$DOTNET_TAG" "C# engine 0.0.0-local (${GITHUB_SHA:0:9})" "$GITHUB_SHA" "${assets[@]}" "$guide"
            fi

            echo "## Demo site"
            echo
            echo "deploy-demo replaces what the \`embed-pdf-rust-kernel-eval\` Worker serves with this run's build of \`examples/rust-kernel-eval\` at \`${GITHUB_SHA:0:9}\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  # The run's one approval, and the only job with an environment. It runs
  # nothing: its reviewers read summarize's summary before they approve.
  approve:
    needs: summarize
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # No environment on a dry run: nothing to approve.
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    permissions: {}
    steps:
      - name: Approved
        run: echo "approved; the publish jobs start now"

  runtime-publish:
    name: release-runtime.yml (publish)
    needs: [approve, slices-runtime, runtime]
    uses: ./.github/workflows/release-runtime.yml
    permissions:
      contents: write
    with:
      stage: publish
      runtime_sha: ${{ needs.slices-runtime.outputs.runtime_sha }}
      published: ${{ needs.runtime.outputs.published }}
      dry_run: ${{ inputs.dry_run }}

  payload-publish:
    name: release-payload.yml (publish)
    needs: [approve, payload]
    uses: ./.github/workflows/release-payload.yml
    permissions:
      contents: write
    with:
      stage: publish
      payload_tag: ${{ needs.payload.outputs.payload_tag }}
      published: ${{ needs.payload.outputs.published }}
      dry_run: ${{ inputs.dry_run }}

  apple-publish:
    name: release-apple.yml (publish)
    needs: [approve, apple]
    uses: ./.github/workflows/release-apple.yml
    permissions:
      contents: write
    with:
      stage: publish
      state: ${{ needs.apple.outputs.state }}
      apple_tag: ${{ needs.apple.outputs.apple_tag }}
      checksum: ${{ needs.apple.outputs.checksum }}
      dry_run: ${{ inputs.dry_run }}

  # The Apple manifests name an engine built from the runtime-src gitlink, so
  # they are committed only once the runtime and payload of that gitlink are
  # out too. swift-release tags the pin commit.
  pin:
    name: pin
    needs: [approve, apple, apple-publish, runtime-publish, payload-publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      pin_sha: ${{ steps.pin.outputs.pin_sha }}
    env:
      STATE: ${{ needs.apple.outputs.state }}
      TAG: ${{ needs.apple.outputs.apple_tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check the ref and the Apple state
        run: |
          [[ "$REF_TYPE" == branch ]] || { echo "::error::the train pushes to its branch; $REF_NAME is a $REF_TYPE"; exit 1; }
          case "$STATE" in
            current|build|pin) echo "apple: $TAG $STATE" ;;
            *) echo "::error::release-apple.yml reported state '$STATE'"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # From apple-publish on build, from apple on pin.
      - uses: actions/download-artifact@v8
        if: needs.apple.outputs.state != 'current'
        with:
          name: apple-manifests
          path: ${{ runner.temp }}/apple-manifests

      - name: Commit the pinned manifests
        id: pin
        run: |
          if [[ "$STATE" == current ]]; then
            echo "both manifests already pin $TAG; the releases tag $GITHUB_SHA"
            echo "pin_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          src=$RUNNER_TEMP/apple-manifests
          nested=platforms/apple/EmbedPDF/Package.swift
          cp "$src/Package.swift" Package.swift
          cp "$src/$nested" "$nested"
          grep -qxF "let engineRelease = \"$TAG\"" "$nested" \
            || { echo "::error::apple-manifests' $nested does not pin $TAG"; exit 1; }
          grep -qF "/releases/download/$TAG/EmbedPDFBindings.xcframework.zip\"" Package.swift \
            || { echo "::error::apple-manifests' Package.swift does not pin $TAG"; exit 1; }
          changed=$(git status --porcelain)
          [[ -n "$changed" ]] || { echo "::error::release-apple.yml reported $STATE, but its manifests match the checkout"; exit 1; }
          git add Package.swift "$nested"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898333+github-actions[bot]@users.noreply.github.com' \
              commit -m "build(apple): pin $TAG"
          git show --stat HEAD
          [[ -z "$(git status --porcelain)" ]] || { echo "::error::apple-manifests changed files other than the two manifests"; git status --porcelain; exit 1; }
          if [[ "$DRY_RUN" == true ]]; then
            echo "dry run: would run git push origin HEAD:refs/heads/$REF_NAME"
            echo "dry run: the releases name $GITHUB_SHA, the commit this run built"
            echo "pin_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No force: a branch that moved since the dispatch fails the push.
          git push origin "HEAD:refs/heads/$REF_NAME"
          pin_sha=$(git rev-parse HEAD)
          echo "pushed $pin_sha to $REF_NAME"
          echo "pin_sha=$pin_sha" >> "$GITHUB_OUTPUT"

  swift-release:
    name: release swift
    needs: [pin, viewer]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      PIN_SHA: ${{ needs.pin.outputs.pin_sha }}
      VERSION: ${{ inputs.swift_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.pin_sha }}
          fetch-depth: 1

      # No assets: SwiftPM resolves the package from the tag.
      - name: Release the Swift package
        run: |
          bash scripts/release/github-release.sh publish "$VERSION" "$PIN_SHA" \
            "Swift package $VERSION" "docs/releases/$VERSION.md"

  # Tags github.sha, the commit the tarball was built from and names in its
  # buildInfo. The tarball carries its payload, so it doesn't wait for
  # payload-publish.
  viewer-release:
    name: release viewer
    needs: [approve, viewer]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      VERSION: ${{ inputs.viewer_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: rust-viewer-tarball
          path: ${{ runner.temp }}/rust-viewer-tarball

      - name: Release the Rust viewer bundle
        run: |
          bash scripts/release/github-release.sh publish "rust-viewer-$VERSION" "$GITHUB_SHA" \
            "Rust viewer bundle $VERSION" "docs/releases/rust-viewer-$VERSION.md" \
            "$RUNNER_TEMP/rust-viewer-tarball/mfb-embedpdf-rust-viewer-$VERSION.tgz"

  # Tags github.sha, the commit the package was built from and its provenance
  # record names. preflight checked the tag; dotnet itself doesn't wait for it.
  dotnet-release:
    name: release dotnet
    needs: [approve, preflight, dotnet]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      PACKAGE: EmbedPDF.Engine.0.0.0-local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # One artifact per RID (dotnet-release-<rid>), merged: their file names
      # don't overlap.
      - uses: actions/download-artifact@v8
        with:
          pattern: dotnet-release-*
          merge-multiple: true
          path: ${{ runner.temp }}/dotnet-release

      # The guide names the release tag and commit, so it is rendered here.
      - name: Render the existing-app guide
        run: |
          R=$RUNNER_TEMP/dotnet-release
          ls -l "$R"
          for rid in linux-arm64 linux-x64 osx-arm64 win-x64; do
            (cd "$R" && sha256sum -c "$PACKAGE.$rid.nupkg.sha256")
          done
          tag="dotnet-engine-0.0.0-local-${GITHUB_SHA:0:12}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          bash platforms/dotnet/packaging/render-guide.sh "$R/EmbedPDF-CSharp-Existing-App.md.in" "$R/guide-facts.json" \
            "$GH_REPO" "$tag" "$GITHUB_SHA" "$R/EmbedPDF-CSharp-Existing-App.md"

      - name: Release the C# engine
        run: |
          R=$RUNNER_TEMP/dotnet-release
          assets=()
          for rid in linux-arm64 linux-x64 osx-arm64 win-x64; do
            assets+=("$R/$PACKAGE.$rid.nupkg" "$R/$PACKAGE.$rid.nupkg.sha256" "$R/$PACKAGE.$rid.provenance.json" "$R/$PACKAGE.validation.$rid.json")
          done
          bash scripts/release/github-release.sh publish "$TAG" "$GITHUB_SHA" \
            "C# engine 0.0.0-local (${GITHUB_SHA:0:9})" docs/releases/dotnet-engine.md \
            "${assets[@]}" "$R/EmbedPDF-CSharp-Existing-App.md"

  # Replaces the hosted demo with viewer's build of examples/rust-kernel-eval
  # on every real run, whether or not the viewer bundle is new, so a re-run
  # deploys the same files again. The Cloudflare token is a repository
  # secret: approve's is the train's only environment, so no other job can
  # read environment secrets. A dry run checks the config with wrangler's
  # --dry-run, which doesn't sign in.
  deploy-demo:
    name: deploy demo
    needs: [approve, viewer]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      # renovate: datasource=npm depName=wrangler
      WRANGLER_VERSION: 4.168.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: actions/download-artifact@v8
        with:
          name: rust-kernel-eval-site
          path: examples/rust-kernel-eval/dist

      - name: Deploy the demo
        working-directory: examples/rust-kernel-eval
        env:
          CLOUDFLARE_API_TOKEN: ${{ !inputs.dry_run && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ !inputs.dry_run && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -f dist/index.html || { echo "::error::rust-kernel-eval-site has no index.html"; exit 1; }
          if [[ "$DRY_RUN" == true ]]; then
            npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run
            echo "dry run: would run wrangler deploy for $(find dist -type f | wc -l) files"
            exit 0
          fi
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --message "release-train ${GITHUB_SHA:0:9}, run $GITHUB_RUN_ID"
          echo "deployed ${GITHUB_SHA:0:9} to https://embed-pdf-rust-kernel-eval.roan-util-cloudfare.workers.dev" >> "$GITHUB_STEP_SUMMARY"
