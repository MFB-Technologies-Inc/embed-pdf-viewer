# Publish the viewer perf history page (perf-compare/history) to GitHub
# Pages. The page is self-contained, so the directory deploys as-is.
name: Perf history Pages

on:
  push:
    branches: [research/multi-platform-rust-core-impl-plugins]
    paths:
      - 'perf-compare/history/**'
      - '.github/workflows/perf-history-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the history page
        uses: actions/upload-pages-artifact@v5
        with:
          path: perf-compare/history

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
