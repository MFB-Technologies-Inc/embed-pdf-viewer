name: release-fork-slices

# Builds the PDFium fork (the runtime-src submodule) at its gitlink for the
# release targets inputs.targets names, one runner each, and uploads each slice
# as the artifact
# fork-slice-<target>: the packaged staging dir under staging/ and the archive
# libembedpdf-runtime-<target>-<sha7>.tar.gz. scripts/release/build-fork-slice.mjs
# does the build; this workflow only provisions the runner around it.
#
# A slice is cached per target, toolchain, runtime-src commit, FORK_RECIPE and
# build-fork-slice.mjs, so a release whose gitlink did not move skips the
# submodule fetch, sync and build and only re-uploads the cached slice.

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of the targets to build, e.g. ["wasm32-eh"]. Each must be a target in the plan job''s table.'
        required: true
        type: string
    outputs:
      runtime_sha:
        description: The runtime-src gitlink the slices were built at.
        value: ${{ jobs.slice.outputs.runtime_sha }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The slice matrix, cut down to inputs.targets. A matrix include can't
  # filter: an entry that matches no other row adds a leg of its own.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # toolchain goes into the slice key: change what a leg builds with (the
      # Xcode setup-xcode-27 selects, an emsdk version, the container image)
      # and bump it here, so only that leg's slices rebuild. An empty container
      # runs the leg on the host, as the macOS legs need. xcode-27 is a preview
      # image label.
      - name: Plan the slices
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          all='[
            {"target": "linux-arm64", "runs-on": "ubuntu-24.04", "container": "debian:trixie", "toolchain": "trixie"},
            {"target": "android-arm64", "runs-on": "ubuntu-24.04", "container": "debian:trixie", "toolchain": "trixie"},
            {"target": "android-x64", "runs-on": "ubuntu-24.04", "container": "debian:trixie", "toolchain": "trixie"},
            {"target": "wasm32", "runs-on": "ubuntu-24.04", "container": "debian:trixie", "toolchain": "emsdk-3.1.72"},
            {"target": "wasm32-eh", "runs-on": "ubuntu-24.04", "container": "debian:trixie", "toolchain": "emsdk-4.0.0"},
            {"target": "ios-arm64", "runs-on": "xcode-27", "container": "", "toolchain": "xcode-27.2"},
            {"target": "ios-sim-arm64", "runs-on": "xcode-27", "container": "", "toolchain": "xcode-27.2"},
            {"target": "darwin-static-arm64", "runs-on": "xcode-27", "container": "", "toolchain": "xcode-27.2"},
            {"target": "darwin-static-x64", "runs-on": "xcode-27", "container": "", "toolchain": "xcode-27.2"}
          ]'
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<<"$TARGETS" >/dev/null 2>&1 \
            || { echo "::error::targets must be a non-empty JSON array of strings, got '$TARGETS'"; exit 1; }
          unknown=$(jq -nr --argjson all "$all" --argjson want "$TARGETS" '$want - [$all[].target] | join(", ")')
          [[ -z "$unknown" ]] || { echo "::error::unknown targets: $unknown"; exit 1; }
          matrix=$(jq -nc --argjson all "$all" --argjson want "$TARGETS" '{include: [$all[] | select(.target as $t | $want | index($t))]}')
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  slice:
    name: slice (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runs-on }}
    # An empty image runs the job on the host, as the macOS legs need.
    container: ${{ matrix.container }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    outputs:
      # Every leg computes the same value.
      runtime_sha: ${{ steps.key.outputs.runtime_sha }}
    env:
      SLICE_DIR: fork-slice-out
    steps:
      # The packages a debian:trixie fork build has needed, minus nodejs:
      # setup-node supplies Node 24 below. git must exist before checkout, or
      # checkout falls back to a tarball with no repository to read the
      # gitlink from or fetch the submodule into.
      - name: Install build tools
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3 curl ca-certificates xz-utils bzip2 lsb-release file \
            pkg-config tar patch unzip sudo
          # The workspace and the submodule belong to the host's runner user.
          git config --global --add safe.directory '*'

      # No submodule yet: the key needs only the gitlink, and a cache hit
      # needs nothing else.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve the slice key
        id: key
        env:
          TARGET: ${{ matrix.target }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          # The runtime-src sha pins the fork's scripts and patches. Of the
          # files outside it, only build-fork-slice.mjs is hashed:
          # build-arm.mjs's buildFork is versioned by FORK_RECIPE instead, so
          # unrelated edits there don't rebuild every slice.
          SCRIPTS_HASH: ${{ hashFiles('scripts/release/build-fork-slice.mjs') }}
        run: |
          sha=$(git ls-tree HEAD packages/engine/runtime/runtime-src | awk '{print $3}')
          recipe=$(sed -n 's/^const FORK_RECIPE = \([0-9][0-9]*\);.*/\1/p' perf-compare/scripts/build-arm.mjs)
          test -n "$sha" || { echo "::error::no runtime-src gitlink at HEAD"; exit 1; }
          test -n "$recipe" || { echo "::error::no FORK_RECIPE in perf-compare/scripts/build-arm.mjs"; exit 1; }
          work="$RUNNER_TEMP/work"
          echo "PERF_WORK_DIR=$work" >> "$GITHUB_ENV"
          {
            echo "runtime_sha=$sha"
            echo "slice=fork-slice-v1-$TARGET-$TOOLCHAIN-$sha-$recipe-$SCRIPTS_HASH"
            echo "week=$(date -u +%G-W%V)"
            echo "work=$work"
          } >> "$GITHUB_OUTPUT"
          echo "runtime-src $sha, FORK_RECIPE $recipe, work dir $work"

      - name: Restore the slice
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SLICE_DIR }}
          key: ${{ steps.key.outputs.slice }}

      # Full history: buildFork clones runtime-src from the submodule and
      # checks out the gitlink commit there, and the fork's scripts read its
      # ancestry.
      - name: Fetch runtime-src
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git -c protocol.version=2 submodule update --init --recursive
          src=packages/engine/runtime/runtime-src
          if [ "$(git -C "$src" rev-parse --is-shallow-repository)" = true ]; then
            git -C "$src" fetch --unshallow || true
          fi
          git -C "$src" log -1 --format='runtime-src at %H'

      - uses: actions/setup-node@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 26

      - uses: ./.github/actions/setup-xcode-27
        if: steps.cache.outputs.cache-hit != 'true' && matrix.container == ''

      # The fork's GN toolchain reads only runtime-src/third_party/emsdk, and
      # emsdk-version.sh --check refuses any version there but its pin.
      - uses: ./.github/actions/setup-emsdk
        if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.target, 'wasm32')
        with:
          version: ${{ matrix.target == 'wasm32-eh' && '4.0.0' || '3.1.72' }}
          dir: packages/engine/runtime/runtime-src/third_party/emsdk

      # Both build paths in build-fork-slice.mjs bootstrap depot_tools at
      # $PERF_WORK_DIR/depot_tools and skip it when already bootstrapped.
      - name: Restore depot_tools
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ${{ steps.key.outputs.work }}/depot_tools
          key: depot-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.week }}

      - name: Build the slice
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/release/build-fork-slice.mjs "$TARGET" "$SLICE_DIR"

      - name: Disk usage
        if: always()
        run: df -h

      - name: Save the slice
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.SLICE_DIR }}
          key: ${{ steps.key.outputs.slice }}

      - uses: actions/upload-artifact@v6
        with:
          name: fork-slice-${{ matrix.target }}
          path: ${{ env.SLICE_DIR }}/
          if-no-files-found: error
