name: release-payload

# Publishes the wasm runtime payload as runtime-payloads-<hash> on this repo,
# with scripts/publish-engine-payload.mjs --only wasm. Its PDFium is the
# wasm32-eh slice release-fork-slices.yml uploaded (fork-slice-wasm32-eh),
# stamped into buildFork's cache so the fork is not built again.
#
#   key      computes the payload hash (runtime-payload-hash.sh) and asks the
#            repo's releases whether that payload is out. Then nothing else runs.
#   verify   runs the script's build stage (--stage build): link, verify,
#            pack. No environment, no gh. Uploads the archive, its .sha256
#            and its facts as payload-release, and the built npm/wasm32/lib
#            as payload-wasm32. On dry_run this is the last job.
#   publish  under the release environment, after its reviewers approve:
#            --stage publish with the job's token, on payload-release. It
#            runs no build code (no pnpm install, cargo or emsdk), since its
#            token can write to this repo.

on:
  workflow_call:
    inputs:
      dry_run:
        description: Build and pack the payload and print the publish command without running it.
        required: false
        type: boolean
        default: false
    outputs:
      payload_tag:
        description: The payload release tag, runtime-payloads-<hash>.
        value: ${{ jobs.key.outputs.payload_tag }}
      published:
        description: "'true' when the payload was already published and this run skipped it."
        value: ${{ jobs.key.outputs.published }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  EMBEDPDF_RELEASE_REPO: ${{ github.repository }}

jobs:
  key:
    runs-on: ubuntu-24.04
    outputs:
      payload_tag: ${{ steps.key.outputs.payload_tag }}
      published: ${{ steps.key.outputs.published }}
    steps:
      # The hash reads the runtime-src gitlink from the index, not the
      # submodule's files.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Published means what the script's releaseVerdict means: not a draft,
      # with the archive and its .sha256. A draft or partial release still
      # goes to the publish job, where the script stops on it with its own
      # message.
      - name: Compute the payload tag
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: engine-runtime-payload-wasm32.tar.gz
        run: |
          hash=$(bash packages/engine/runtime/scripts/runtime-payload-hash.sh)
          [[ "$hash" =~ ^[0-9a-f]{16}$ ]] || { echo "::error::runtime-payload-hash.sh printed '$hash'"; exit 1; }
          tag="runtime-payloads-$hash"
          echo "payload_tag=$tag" >> "$GITHUB_OUTPUT"
          if view=$(gh release view "$tag" -R "$EMBEDPDF_RELEASE_REPO" --json assets,isDraft 2>&1); then
            if jq -e --arg a "$ASSET" '(.isDraft | not) and any(.assets[]; .name == $a) and any(.assets[]; .name == $a + ".sha256")' <<<"$view" >/dev/null; then
              echo "$tag is already published on $EMBEDPDF_RELEASE_REPO; nothing to do."
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::$tag exists on $EMBEDPDF_RELEASE_REPO but is a draft or lacks $ASSET; the publish job will stop on it."
              echo "published=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -qi 'release not found' <<<"$view"; then
            echo "$tag is not on $EMBEDPDF_RELEASE_REPO yet."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::gh couldn't say whether $tag exists on $EMBEDPDF_RELEASE_REPO: $view"
            exit 1
          fi

  verify:
    needs: key
    if: needs.key.outputs.published == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PAYLOAD_TAG: ${{ needs.key.outputs.payload_tag }}
    steps:
      # Full runtime-src history at the gitlink: buildFork clones the fork from
      # this checkout, and the script runs git merge-base --is-ancestor in it.
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set the work directory
        run: echo "PERF_WORK_DIR=$RUNNER_TEMP/work" >> "$GITHUB_ENV"

      # bindgen, for pdfium-sys on wasm32-unknown-emscripten.
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-emscripten
          cache-key: release-payload

      # Where the script looks for emsdk (workDir()/emsdk), at
      # build-arm.mjs's EH_EMSDK_VERSION, with the sysroot bindgen reads.
      - uses: ./.github/actions/setup-emsdk
        with:
          version: 4.0.0
          dir: ${{ env.PERF_WORK_DIR }}/emsdk

      - uses: actions/download-artifact@v7
        with:
          name: fork-slice-wasm32-eh
          path: ${{ runner.temp }}/fork-slice-wasm32-eh

      # Exit 65 when the slice isn't wasm32-eh at the runtime-src gitlink.
      - name: Stamp the fork slice
        run: node scripts/release/stamp-fork-slice.mjs wasm32-eh "$RUNNER_TEMP/fork-slice-wasm32-eh/staging"

      # --stage build never asks gh anything; GH_TOKEN is left unset.
      - name: Build and verify the payload
        run: |
          echo "verifying $PAYLOAD_TAG"
          node scripts/publish-engine-payload.mjs --only wasm --stage build
          hash=$(bash packages/engine/runtime/scripts/runtime-payload-hash.sh)
          if [[ "runtime-payloads-$hash" != "$PAYLOAD_TAG" ]]; then
            echo "::error::the payload hash moved during the run: $PAYLOAD_TAG, now runtime-payloads-$hash"
            exit 1
          fi

      # For publish's reviewers: what --stage publish releases, titled with
      # the tag and targeting the commit the facts name. Written on a dry run
      # too, where publish doesn't run.
      - name: Summarize the release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pub=packages/engine/runtime/.build/publish
          asset=$pub/engine-runtime-payload-wasm32.tar.gz
          bash scripts/release/release-summary.sh release "$PAYLOAD_TAG" "$PAYLOAD_TAG" "$(jq -r .head "$asset.json")" \
            "$asset" "$asset.sha256" >> "$GITHUB_STEP_SUMMARY"

      # What --stage publish releases, from the gitignored dir --stage build
      # staged it in.
      - uses: actions/upload-artifact@v6
        with:
          name: payload-release
          path: packages/engine/runtime/.build/publish/
          if-no-files-found: error

      # A successful --stage build leaves the payload it built in
      # npm/wasm32/lib, marked dry-run-<hash> in .payload-source. The train's
      # dry run builds the viewer from it, since no release holds it yet.
      - uses: actions/upload-artifact@v6
        with:
          name: payload-wasm32
          path: packages/engine/runtime/npm/wasm32/lib/
          include-hidden-files: true
          if-no-files-found: error

      - name: Disk usage
        if: always()
        run: df -h

  publish:
    name: publish ${{ needs.key.outputs.payload_tag }}
    needs: [key, verify]
    if: ${{ !inputs.dry_run && needs.key.outputs.published == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.key.outputs.payload_tag }}
    permissions:
      contents: write
    env:
      PAYLOAD_TAG: ${{ needs.key.outputs.payload_tag }}
    steps:
      # No submodules: the payload hash reads the runtime-src gitlink from the
      # index, and --stage publish needs no checkout of it.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # The script imports only Node's built-ins and this repo's modules, so
      # no pnpm install.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/download-artifact@v7
        with:
          name: payload-release
          path: packages/engine/runtime/.build/publish

      # The script recomputes the hash and skips a payload that is already
      # out, so a release made since the key job is not made twice. It refuses
      # a payload-release staged for another tag or commit.
      - name: Publish the payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "publishing $PAYLOAD_TAG"
          node scripts/publish-engine-payload.mjs --only wasm --stage publish
          hash=$(bash packages/engine/runtime/scripts/runtime-payload-hash.sh)
          if [[ "runtime-payloads-$hash" != "$PAYLOAD_TAG" ]]; then
            echo "::error::the payload hash moved during the run: $PAYLOAD_TAG, now runtime-payloads-$hash"
            exit 1
          fi
