name: release-dotnet

# Builds, tests, packs and validates the EmbedPDF.Engine .NET package once per
# RID, each on its own native host, and uploads each RID's release files as the
# artifact dotnet-release-<rid>, for linux-arm64, linux-x64, osx-arm64 and
# win-x64 (osx-x64 is not built). Each package carries one RID: the
# packaging tooling validates a package only on the host its RID names
# (platforms/dotnet/packaging/README.md), so there is no merged package.
# linux-arm64 reproduces the hand-run sequence in
# docs/research/upstream-catchup-2026-11-18/scripts/cu-c10/dotnet-release.sh,
# which made the dotnet-engine-0.0.0-local-* releases. The workflow depends on
# nothing else in the release train: the PDFium each row packs is the upstream
# runtime archive pinned by packages/engine/runtime/engine-runtime-build.json.
#
#   image    resolves debian:trixie to its linux/arm64 and linux/amd64
#            manifest digests.
#   package  one row per RID. The Linux rows run in that exact image on a
#            native runner; the macOS and Windows rows run on the hosted
#            image. Each row runs the facade tests, the parity self-test, the
#            packaging unit tests, the release epdf-capi build, pack and
#            validate (validate.ps1 on Windows). linux-arm64 then runs the
#            existing-app guide's steps in a fresh project.
#
# Each artifact holds the RID's four release assets: the nupkg, its .sha256,
# the provenance manifest and the validation record, the nupkg and provenance
# names qualified with the RID. linux-arm64's also holds the guide template
# EmbedPDF-CSharp-Existing-App.md.in and guide-facts.json. The guide names the
# release tag and the commit, which belong to the release, so the orchestrator
# renders it with platforms/dotnet/packaging/render-guide.sh and publishes it
# beside the sixteen package assets.
#
# Fonts: the Linux rows pack Debian's fonts-dejavu-core DejaVu Sans
# (packaging/ci-fonts.sh), as the hand-run release did. The macOS and Windows
# rows pack the checked-in, empty packaging/fonts.json, as their hand
# validations under platforms/dotnet/validation/ did; validation itself
# needs no font. The existing-app guide registers DejaVu Sans, so it stays
# the linux-arm64 walkthrough.
#
# Microsoft publishes no Debian trixie .NET SDK image (no 10.0.403-trixie
# tag), so every row installs SDK 10.0.403 from Microsoft's archive.
#
# The runtime, runtime-pack and runtime-validate jobs build the viewer
# packages, EmbedPDF.Runtime and EmbedPDF, from all five RIDs; their comment
# below says what they produce.
#
# This workflow never publishes; the orchestrator does. dry_run exists so every
# release workflow takes the same inputs, and changes nothing here.

on:
  workflow_call:
    inputs:
      dry_run:
        description: Accepted for symmetry with the other release workflows. This one never publishes either way.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PACKAGE: EmbedPDF.Engine.0.0.0-local

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      arm64: ${{ steps.digest.outputs.arm64 }}
      amd64: ${{ steps.digest.outputs.amd64 }}
    steps:
      # The platform manifest digests, not the index digest: each names exactly
      # the image its row pulls, and `docker pull debian@<digest>` fetches it
      # again. validate.sh records it as environment.imageId, whose schema is a
      # bare sha256:<hex>.
      - name: Resolve debian:trixie for linux/arm64 and linux/amd64
        id: digest
        run: |
          index=$(docker manifest inspect debian:trixie)
          for arch in arm64 amd64; do
            digest=$(jq -r --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0].digest else empty end' <<<"$index")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no single linux/$arch manifest for debian:trixie (got '$digest')"; exit 1; }
            echo "debian:trixie linux/$arch = $digest"
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done

  package:
    needs: image
    name: package (${{ matrix.rid }})
    strategy:
      fail-fast: false
      # SDK archives: the 10.0.403 SDK `files` entries of
      # https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json,
      # read 2026-11-19. The SDK compiles the shipped DLL, so each archive is
      # checked against its SHA-512 before it is unpacked. The two Linux hashes
      # are also in .devcontainer/Dockerfile (DOTNET_SDK_VERSION); change both.
      matrix:
        include:
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            image_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            fork_target: linux-arm64
            sdk_url: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-arm64.tar.gz
            sdk_sha512: 0966aa2b70f4677b8319be9df447a78a0dcd6164836425b55a68fd714f4023feb87b4cac21b9a996b79472ad54487cd0adcd2a9dfd570e2b2a1d26423a2baa9b
          - rid: linux-x64
            runner: ubuntu-24.04
            image_arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            fork_target: linux-x64
            sdk_url: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-x64.tar.gz
            sdk_sha512: b7b3d8461cf98b07d2552ce9199702fa3ad010ac2671a5f8cd5136f7534e50f6855ba7bbb02b11494563f1d04156276a31cda1103b900e5eecd0d9473dc7b9c5
          - rid: osx-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            fork_target: darwin-arm64
            sdk_url: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-osx-arm64.tar.gz
            sdk_sha512: 5893c66b48ea3674c7da18501059d606e96f3672fabe4d5e41762e692c7c83df3ee0b2b9dc5a0786191da2dc413d7335158101c14c935ab217f31ac2529770f3
          - rid: win-x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            fork_target: win32-x64
            sdk_url: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-win-x64.zip
            sdk_sha512: 7a114c318fa7f1d9822991b534b2814d0e78386ceda816b371f5141acefe741d87ccb606ede06cadac8f9ac5070e32b708a67bbd1619ff5e5a7858a27874ef48
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Only the Linux rows have an image_arch; an empty container runs the job
    # on the hosted image.
    container: ${{ matrix.image_arch && format('debian:trixie@{0}', needs.image.outputs[matrix.image_arch]) || '' }}
    env:
      RID: ${{ matrix.rid }}
      RUST_TARGET: ${{ matrix.rust_target }}
      FORK_TARGET: ${{ matrix.fork_target }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_INCREMENTAL: "0"
      # validate.sh refuses a Linux run without it and records it in the
      # validation record. Empty on macOS and Windows, which validate.sh then
      # records as a host run.
      EPDF_IMAGE_ID: ${{ matrix.image_arch && needs.image.outputs[matrix.image_arch] || '' }}
      EPDF_HOST_OS: ${{ matrix.image_arch && 'linux' || '' }}
    steps:
      # Before checkout: without git, actions/checkout downloads a tarball,
      # and package.py reads the source identity from git.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq zstd xz-utils \
            build-essential clang libclang-dev python3 \
            libicu-dev tzdata zlib1g fonts-dejavu-core
          rm -rf /var/lib/apt/lists/*

      # The hosted Windows image checks text out with CRLF. Bash refuses the
      # scripts, and the fixtures and pinned inputs would no longer match
      # their hashes.
      - name: Check out LF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # In the Linux container the workspace belongs to the runner user and
      # the job runs as root; git refuses the repository without this.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install .NET SDK 10.0.403
        env:
          SDK_URL: ${{ matrix.sdk_url }}
          SDK_SHA512: ${{ matrix.sdk_sha512 }}
        run: |
          sdk=$RUNNER_TEMP/${SDK_URL##*/}
          curl -fsSL --retry 3 -o "$sdk" "$SDK_URL"
          if command -v sha512sum >/dev/null 2>&1; then
            echo "$SDK_SHA512  $sdk" | sha512sum -c -
          else
            echo "$SDK_SHA512  $sdk" | shasum -a 512 -c -
          fi
          case $RUNNER_OS in
            Linux) root=/usr/share/dotnet ;;
            *) root=$RUNNER_TEMP/dotnet ;;
          esac
          mkdir -p "$root"
          if [[ "$sdk" == *.zip ]]; then
            # Windows' own bsdtar reads zip; Git Bash's GNU tar does not.
            "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -xf "$sdk" -C "$root"
          else
            tar -xzf "$sdk" -C "$root"
          fi
          rm "$sdk"
          echo "DOTNET_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          cache-key: dotnet-${{ matrix.rid }}

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platforms/dotnet/**/*.csproj', 'platforms/dotnet/global.json') }}

      # pdfium-sys runs bindgen, which needs libclang: the hosted image's LLVM.
      # package.py inspects DLLs with dumpbin, which the image has but not on
      # PATH.
      - name: Windows build tools
        if: runner.os == 'Windows'
        run: |
          llvm='C:\Program Files\LLVM\bin'
          test -f "$(cygpath -u "$llvm")/libclang.dll" || { echo "::error::no libclang.dll in $llvm"; exit 1; }
          echo "LIBCLANG_PATH=$llvm" >> "$GITHUB_ENV"
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
            -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          vs=$(cygpath -u "$vs")
          msvc=$(tr -d '[:space:]' < "$vs/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt")
          bin=$vs/VC/Tools/MSVC/$msvc/bin/Hostx64/x64
          test -x "$bin/dumpbin.exe" || { echo "::error::no dumpbin.exe in $bin"; exit 1; }
          cygpath -w "$bin" >> "$GITHUB_PATH"

      # Upstream's runtime-f2ea75972 archive for this RID, checked against the
      # pin. pack never downloads; it reads this from build/cache.
      - name: Fetch the pinned runtime archive
        run: bash packages/engine/runtime/scripts/fetch-libpdfium.sh "$FORK_TARGET"

      # Every later step reads these. The test steps add the runtime's
      # library directory; pack and validate run without it. FONTS is the
      # manifest pack.sh takes: the Linux rows write theirs (ci-fonts.sh) and
      # the others use the checked-in one.
      - name: Set paths
        run: |
          {
            echo "PDF_RUNTIME_LIB_DIR=$GITHUB_WORKSPACE/packages/engine/runtime/build/libpdfium"
            echo "RUNTIME_ARCHIVE=$GITHUB_WORKSPACE/packages/engine/runtime/build/cache/libembedpdf-runtime-$FORK_TARGET.tar.gz"
            echo "RUNTIME_MANIFEST=$GITHUB_WORKSPACE/packages/engine/runtime/engine-runtime-build.json"
            # Outside platforms/dotnet: package.py hashes untracked files
            # there into the source identity and would mark the package dirty.
            echo "OUT=$RUNNER_TEMP/dotnet"
            if [[ "$RUNNER_OS" == Linux ]]; then
              echo "FONTS=$RUNNER_TEMP/fonts/fonts.json"
            else
              echo "FONTS=$GITHUB_WORKSPACE/platforms/dotnet/packaging/fonts.json"
            fi
            # Git Bash on Windows has no python3.
            if [[ "$RUNNER_OS" == Windows ]]; then echo "PYTHON=python"; else echo "PYTHON=python3"; fi
          } >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          echo "checkout $(git rev-parse HEAD) dirty=[$(git status --porcelain --untracked-files=no | wc -l)]"
          echo "dotnet $(cd platforms/dotnet && dotnet --version) $(rustc --version) $("$PYTHON" --version)"
          # sed reads to the end: `head -1` exits early and pipefail turns
          # ldd's SIGPIPE into exit 141.
          if [[ "$RUNNER_OS" == Linux ]]; then ldd --version | sed -n 1p; else uname -a; fi

      - name: Build epdf-capi (debug)
        run: cargo build --locked -p epdf-capi

      # The facade tests load the debug wrapper, which finds the runtime
      # library through the loader path on Linux and macOS. On Windows the
      # tests stage embedpdf.dll from PDF_RUNTIME_LIB_DIR instead
      # (platforms/dotnet/packaging/README.md).
      - name: dotnet test
        run: |
          export EPDF_NATIVE_DIR="$GITHUB_WORKSPACE/target/debug"
          runtime=$PDF_RUNTIME_LIB_DIR/$FORK_TARGET
          case $RUNNER_OS in
            Linux) export LD_LIBRARY_PATH="$runtime/lib" ;;
            macOS) export DYLD_LIBRARY_PATH="$runtime/lib" ;;
            Windows) export PDF_RUNTIME_LIB_DIR="$runtime/bin" ;;
          esac
          # One retry: the run depends on timing, and only a second failure fails the step.
          if ! dotnet test platforms/dotnet/EmbedPDF.Tests/EmbedPDF.Tests.csproj; then
            echo "::warning::dotnet test failed; retrying once"
            dotnet test platforms/dotnet/EmbedPDF.Tests/EmbedPDF.Tests.csproj
          fi

      - name: Parity self-test
        working-directory: platforms/dotnet
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then export LD_LIBRARY_PATH="$PDF_RUNTIME_LIB_DIR/$FORK_TARGET/lib"; fi
          if ! dotnet run --project EmbedPDF.Parity -- self-test | tee "$RUNNER_TEMP/parity.log"; then
            echo "::warning::parity self-test failed; retrying once"
            dotnet run --project EmbedPDF.Parity -- self-test | tee "$RUNNER_TEMP/parity.log"
          fi
          echo "passed=$(grep -c '"status":"passed"' "$RUNNER_TEMP/parity.log")"

      - name: Packaging unit tests
        run: |
          "$PYTHON" -m unittest discover -s platforms/dotnet/packaging -v

      - name: Build epdf-capi (release)
        run: cargo build --locked -p epdf-capi --release --target "$RUST_TARGET"

      - name: Write the font manifest
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            bash platforms/dotnet/packaging/ci-fonts.sh "$FONTS"
          fi
          cat "$FONTS"

      # pack.sh is `exec python3 packaging/package.py pack`; Windows has no
      # python3, so it runs package.py directly.
      - name: pack
        run: |
          unset LD_LIBRARY_PATH DYLD_LIBRARY_PATH
          args=(--rid "$RID" --out "$OUT/pack" --runtime-manifest "$RUNTIME_MANIFEST"
                --runtime-archive "$RUNTIME_ARCHIVE" --font-manifest "$FONTS")
          if [[ "$RUNNER_OS" == Windows ]]; then
            python platforms/dotnet/packaging/package.py pack "${args[@]}"
          else
            bash platforms/dotnet/pack.sh "${args[@]}"
          fi

      # No --font-manifest, as in the hand-run release: the record's inputs
      # name the checked-in packaging/fonts.json.
      - name: validate.sh
        if: runner.os != 'Windows'
        run: |
          unset LD_LIBRARY_PATH DYLD_LIBRARY_PATH
          bash platforms/dotnet/validate.sh --rid "$RID" --runtime-manifest "$RUNTIME_MANIFEST" --record "$OUT/validate-record.json" \
            --package "$OUT/pack/$PACKAGE.nupkg" --manifest "$OUT/pack/package-manifest.$RID.json"

      # validate.ps1 takes no runtime manifest; its default is the same
      # checked-in pin RUNTIME_MANIFEST names.
      - name: validate.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./platforms/dotnet/validate.ps1 -Rid $env:RID -Record "$env:OUT/validate-record.json" `
            -Package "$env:OUT/pack/$env:PACKAGE.nupkg" -Manifest "$env:OUT/pack/package-manifest.$env:RID.json"

      - name: Check the validated status
        run: |
          status=$(jq -r --arg rid "$RID" '.rids[$rid].status' "$OUT/pack/package-manifest.$RID.json")
          [[ "$status" == VALIDATED ]] || { echo "::error::package manifest status for $RID is '$status', not VALIDATED"; exit 1; }

      # The guide's steps, in a fresh application with its own NuGet cache,
      # from the package under its release asset name.
      # The C# below is the guide's PdfPreview class
      # (platforms/dotnet/EmbedPDF-CSharp-Existing-App.md.in, section 4).
      - name: Existing-app guide
        if: matrix.rid == 'linux-arm64'
        run: |
          set -e
          unset LD_LIBRARY_PATH PDF_RUNTIME_LIB_DIR
          G=$OUT/guide
          mkdir -p "$G/app/local-packages"
          cp "$OUT/pack/$PACKAGE.nupkg" "$G/app/local-packages/$PACKAGE.$RID.nupkg"
          cd "$G/app"
          export NUGET_PACKAGES=$G/nuget-cache
          dotnet new console --framework net10.0 --name YourApp --output .
          cat > NuGet.Config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="EmbedPDFLocal" value="./local-packages" />
            </packageSources>
          </configuration>
          XML
          dotnet add ./YourApp.csproj package EmbedPDF.Engine --version 0.0.0-local
          cat > PdfPreview.cs <<'CS'
          using System;
          using System.IO;
          using System.Threading.Tasks;
          using System.Collections.Immutable;
          using EmbedPDF.Engine;

          public static class PdfPreview
          {
              public static async Task<RgbaImage> RenderFirstPageAsync(byte[] pdf)
              {
                  var font = await File.ReadAllBytesAsync(
                      Path.Combine(AppContext.BaseDirectory, "000-DejaVuSans.ttf"));

                  await using var engine = await PdfEngine.CreateAsync(new()
                  {
                      StartupFonts = ImmutableArray.Create(
                          new StartupFont("parity-dejavu", font)
                          {
                              FamilyName = "DejaVu Sans",
                              Weight = 400,
                              Italic = false,
                              Fallback = true
                          })
                  });

                  await using var document = await engine.OpenAsync(pdf);
                  return await document.RenderAsync(
                      new PageIndex(0), new RenderOptions { Scale = 1.5 });
              }
          }
          CS
          cat > Program.cs <<'CS'
          var pdfBytes = await System.IO.File.ReadAllBytesAsync(args[0]);
          var image = await PdfPreview.RenderFirstPageAsync(pdfBytes);
          System.Console.WriteLine($"rendered {image.Width}x{image.Height} stride={image.Stride} bytes={image.Bytes.Length}");
          CS
          dotnet publish ./YourApp.csproj -c Release --runtime "$RID" --self-contained false --output ./publish
          ./publish/YourApp "$GITHUB_WORKSPACE/tooling/engine-conformance/fixtures/non_identity_text.pdf" | tee "$G/run.log"
          grep -q '^rendered ' "$G/run.log"

      # The .sha256 line is written here rather than by sha256sum, whose
      # Windows build marks the name binary (`*name`).
      - name: Collect the release assets
        run: |
          R=$GITHUB_WORKSPACE/dotnet-release
          nupkg=$PACKAGE.$RID.nupkg
          mkdir -p "$R"
          cp "$OUT/pack/$PACKAGE.nupkg" "$R/$nupkg"
          if command -v sha256sum >/dev/null 2>&1; then
            sha=$(sha256sum "$R/$nupkg" | cut -d' ' -f1)
          else
            sha=$(shasum -a 256 "$R/$nupkg" | cut -d' ' -f1)
          fi
          bytes=$(wc -c < "$R/$nupkg" | tr -d ' ')
          printf '%s  %s\n' "$sha" "$nupkg" > "$R/$nupkg.sha256"
          cp "$OUT/pack/package-manifest.$RID.json" "$R/$PACKAGE.$RID.provenance.json"
          cp "$OUT/validate-record.json" "$R/$PACKAGE.validation.$RID.json"
          {
            echo "### $PACKAGE ($RID)"
            echo
            if [[ -n "$EPDF_IMAGE_ID" ]]; then
              echo "- image: \`debian:trixie@$EPDF_IMAGE_ID\`"
              echo "- highest GLIBC symbol: \`$(objdump -T "$OUT"/pack/*/runtimes/"$RID"/native/lib*.so 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)\`"
            else
              echo "- host: \`$ImageOS $ImageVersion\` ($RUNNER_ARCH)"
            fi
            echo "- sha256: \`$sha\`, $bytes bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$R"

      - name: Collect the guide
        if: matrix.rid == 'linux-arm64'
        run: |
          R=$GITHUB_WORKSPACE/dotnet-release
          cp platforms/dotnet/EmbedPDF-CSharp-Existing-App.md.in "$R/"
          # The build facts the guide states; render-guide.sh documents the
          # format. glibc is the version validate.sh and the guide ran with.
          jq -n \
            --arg sha "$(cut -d' ' -f1 "$R/$PACKAGE.$RID.nupkg.sha256")" \
            --argjson bytes "$(stat -c %s "$R/$PACKAGE.$RID.nupkg")" \
            --arg runtimeTag "$(jq -r --arg target "$FORK_TARGET" '.artifacts[$target].url | capture("/releases/download/(?<tag>[^/]+)/").tag' "$RUNTIME_MANIFEST")" \
            --arg glibc "$(ldd --version | awk 'NR == 1 {print $NF}')" \
            --arg renderSize "$(sed -n 's/^rendered \([0-9]*x[0-9]*\) .*/\1/p' "$OUT/guide/run.log")" \
            '{nupkgSha256: $sha, nupkgBytes: $bytes, runtimeTag: $runtimeTag, glibc: $glibc, renderSize: $renderSize}' \
            > "$R/guide-facts.json"
          cat "$R/guide-facts.json"
          # Checks the facts and the template now rather than at publish time.
          # The rendered file is thrown away: the tag and commit are stand-ins.
          bash platforms/dotnet/packaging/render-guide.sh "$R/EmbedPDF-CSharp-Existing-App.md.in" "$R/guide-facts.json" \
            "$GITHUB_REPOSITORY" check "$(git rev-parse HEAD)" "$RUNNER_TEMP/guide-check.md"
          ls -l "$R"

      # A workspace-relative path: in a container job runner.temp is the
      # host's path, not the container's.
      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-release-${{ matrix.rid }}
          path: dotnet-release
          if-no-files-found: error

  # EmbedPDF.Runtime (docs/superpowers/plans/2026-11-20-dotnet-parity/01-runtime-package.md).
  # One row per RID builds the viewer host (stripped) and stages it with its
  # checksum-verified PDFium as a slice; runtime-pack merges the five slices
  # into one package and packs the EmbedPDF facade against it; runtime-validate
  # runs the local-feed consumer on each native host.
  #
  # Not run yet. Cargo resolves every workspace member's git dependencies, so
  # each cargo step here also fetches the hosted generator fork that
  # crates/uniffi-bindgen-cs names.
  runtime:
    needs: image
    name: runtime slice (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            image_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            fork_target: linux-arm64
          - rid: linux-x64
            runner: ubuntu-24.04
            image_arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            fork_target: linux-x64
          - rid: osx-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            fork_target: darwin-arm64
          - rid: osx-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            fork_target: darwin-x64
          - rid: win-x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            fork_target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container: ${{ matrix.image_arch && format('debian:trixie@{0}', needs.image.outputs[matrix.image_arch]) || '' }}
    env:
      RID: ${{ matrix.rid }}
      FORK_TARGET: ${{ matrix.fork_target }}
      CARGO_INCREMENTAL: "0"
    steps:
      # patchelf gives the Linux host a $ORIGIN runpath at staging.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq zstd xz-utils \
            build-essential clang libclang-dev python3 patchelf
          rm -rf /var/lib/apt/lists/*

      - name: Check out LF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          cache-key: dotnet-runtime-${{ matrix.rid }}

      - name: Windows build tools
        if: runner.os == 'Windows'
        run: |
          llvm='C:\Program Files\LLVM\bin'
          test -f "$(cygpath -u "$llvm")/libclang.dll" || { echo "::error::no libclang.dll in $llvm"; exit 1; }
          echo "LIBCLANG_PATH=$llvm" >> "$GITHUB_ENV"
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
            -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          vs=$(cygpath -u "$vs")
          msvc=$(tr -d '[:space:]' < "$vs/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt")
          bin=$vs/VC/Tools/MSVC/$msvc/bin/Hostx64/x64
          test -x "$bin/dumpbin.exe" || { echo "::error::no dumpbin.exe in $bin"; exit 1; }
          cygpath -w "$bin" >> "$GITHUB_PATH"
          echo "PYTHON=python" >> "$GITHUB_ENV"

      - name: Fetch the pinned runtime archive
        run: bash packages/engine/runtime/scripts/fetch-libpdfium.sh "$FORK_TARGET"

      - name: Build the viewer host
        run: |
          bash platforms/dotnet/build-viewer-host.sh "$RID" | tee "$RUNNER_TEMP/host.txt"
          echo "HOST_LIB=$(tail -1 "$RUNNER_TEMP/host.txt")" >> "$GITHUB_ENV"

      # A workspace-relative slice: in a container job runner.temp is the
      # host's path, not the container's.
      - name: Stage the slice
        run: |
          "${PYTHON:-python3}" platforms/dotnet/packaging/package.py stage-runtime --rid "$RID" \
            --native-lib "$HOST_LIB" --out "runtime-slice" \
            --runtime-archive "packages/engine/runtime/build/cache/libembedpdf-runtime-$FORK_TARGET.tar.gz"
          jq -r '.files[] | "\(.bytes)  \(.path)"' runtime-slice/runtime-slice.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-runtime-slice-${{ matrix.rid }}
          path: runtime-slice
          if-no-files-found: error

  runtime-pack:
    needs: [image, runtime]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container: debian:trixie@${{ needs.image.outputs.arm64 }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CARGO_INCREMENTAL: "0"
      EPDF_IMAGE_ID: ${{ needs.image.outputs.arm64 }}
      EPDF_HOST_OS: linux
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq zstd xz-utils \
            build-essential clang libclang-dev python3 libicu-dev tzdata zlib1g
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install .NET SDK 10.0.403
        run: |
          sdk=$RUNNER_TEMP/dotnet-sdk.tar.gz
          curl -fsSL --retry 3 -o "$sdk" https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-linux-arm64.tar.gz
          echo "0966aa2b70f4677b8319be9df447a78a0dcd6164836425b55a68fd714f4023feb87b4cac21b9a996b79472ad54487cd0adcd2a9dfd570e2b2a1d26423a2baa9b  $sdk" | sha512sum -c -
          mkdir -p /usr/share/dotnet
          tar -xzf "$sdk" -C /usr/share/dotnet
          rm "$sdk"
          echo "DOTNET_ROOT=/usr/share/dotnet" >> "$GITHUB_ENV"
          echo "/usr/share/dotnet" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-unknown-linux-gnu
          cache-key: dotnet-runtime-pack

      - name: Check the engine pin
        run: bash platforms/dotnet/check-dotnet-engine.sh

      - uses: actions/download-artifact@v7
        with:
          pattern: dotnet-runtime-slice-*
          path: slices

      - name: Pack EmbedPDF.Runtime
        run: |
          args=()
          for slice in slices/*/; do args+=(--slice "$slice"); done
          python3 platforms/dotnet/packaging/package.py pack-runtime "${args[@]}" --out dotnet-runtime

      # The packaged hosts are stripped, and the uniffi metadata the generator
      # reads goes with the symbol table, so the bindings come from an
      # unstripped build of the same tree.
      - name: Generate the bindings
        run: |
          bash packages/engine/runtime/scripts/fetch-libpdfium.sh linux-arm64
          cargo rustc -p epdf-viewer-host --release --locked --crate-type cdylib
          bash platforms/dotnet/generate-bindings.sh

      - name: Viewer tests
        run: dotnet test platforms/dotnet/EmbedPDF.Viewer.Tests/EmbedPDF.Viewer.Tests.csproj

      - name: Pack EmbedPDF
        run: |
          python3 platforms/dotnet/packaging/package.py pack-facade \
            --runtime-package dotnet-runtime/EmbedPDF.Runtime.*.nupkg --out dotnet-runtime

      - name: Validate linux-arm64
        run: |
          python3 platforms/dotnet/packaging/package.py validate-runtime --rid linux-arm64 \
            --package dotnet-runtime/EmbedPDF.Runtime.*.nupkg --facade dotnet-runtime/EmbedPDF.0.0.0-local.nupkg \
            --manifest dotnet-runtime/package-manifest.runtime.json --record dotnet-runtime/validation.linux-arm64.json

      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-runtime
          path: |
            dotnet-runtime/*.nupkg
            dotnet-runtime/*.json
          if-no-files-found: error

  # The macOS and Windows consumers. The manifest each row updates is its own
  # copy; the record is the evidence.
  runtime-validate:
    needs: runtime-pack
    name: runtime validate (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
            sdk_url: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-osx-arm64.tar.gz
            sdk_sha512: 5893c66b48ea3674c7da18501059d606e96f3672fabe4d5e41762e692c7c83df3ee0b2b9dc5a0786191da2dc413d7335158101c14c935ab217f31ac2529770f3
          - rid: osx-x64
            runner: macos-15-intel
            sdk_url: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-osx-x64.tar.gz
            sdk_sha512: ce95d225b86d2401f111c2aa6df0f5e6855c375b7b34ab4a73df90c56f2b0fc2a44398cfe455cb689670bc8590012e943b64c7a590122af98cdc067721b12223
          - rid: win-x64
            runner: windows-2022
            sdk_url: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-win-x64.zip
            sdk_sha512: 7a114c318fa7f1d9822991b534b2814d0e78386ceda816b371f5141acefe741d87ccb606ede06cadac8f9ac5070e32b708a67bbd1619ff5e5a7858a27874ef48
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RID: ${{ matrix.rid }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out LF on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install .NET SDK 10.0.403
        env:
          SDK_URL: ${{ matrix.sdk_url }}
          SDK_SHA512: ${{ matrix.sdk_sha512 }}
        run: |
          sdk=$RUNNER_TEMP/${SDK_URL##*/}
          curl -fsSL --retry 3 -o "$sdk" "$SDK_URL"
          if command -v sha512sum >/dev/null 2>&1; then
            echo "$SDK_SHA512  $sdk" | sha512sum -c -
          else
            echo "$SDK_SHA512  $sdk" | shasum -a 512 -c -
          fi
          root=$RUNNER_TEMP/dotnet
          mkdir -p "$root"
          if [[ "$sdk" == *.zip ]]; then
            "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -xf "$sdk" -C "$root"
          else
            tar -xzf "$sdk" -C "$root"
          fi
          rm "$sdk"
          echo "DOTNET_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root" >> "$GITHUB_PATH"
          if [[ "$RUNNER_OS" == Windows ]]; then echo "PYTHON=python" >> "$GITHUB_ENV"; else echo "PYTHON=python3" >> "$GITHUB_ENV"; fi

      - uses: actions/download-artifact@v7
        with:
          name: dotnet-runtime
          path: dotnet-runtime

      - name: Validate
        run: |
          runtime=$(ls dotnet-runtime/EmbedPDF.Runtime.*.nupkg)
          "$PYTHON" platforms/dotnet/packaging/package.py validate-runtime --rid "$RID" \
            --package "$runtime" --facade dotnet-runtime/EmbedPDF.0.0.0-local.nupkg \
            --manifest dotnet-runtime/package-manifest.runtime.json --record "dotnet-runtime-validation.$RID.json"

      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-runtime-validation-${{ matrix.rid }}
          path: dotnet-runtime-validation.${{ matrix.rid }}.json
          if-no-files-found: error
