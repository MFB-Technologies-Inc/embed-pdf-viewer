name: release-runtime

# Publishes the PDFium fork (runtime-src) at one commit as the prerelease
# runtime-<sha> on the release repo: the five slice archives that
# release-fork-slices.yml uploaded (fork-slice-<target>), plus the manifest
# write-manifest.sh writes from them. Nothing is built here.
#
#   check    is runtime-<sha> already out? Then nothing else runs.
#   prepare  downloads the slices, runs the fork's upstream freshness report
#            and manifest scripts at <sha>, uploads the release files.
#   publish  creates the release with the App token, under the release
#            environment, so its reviewers approve after the work is done.
#
# dry_run runs every job without the environment or the token, and prints the
# gh command instead of running it.

on:
  workflow_call:
    inputs:
      runtime_sha:
        description: Full runtime-src commit to publish (release-fork-slices.yml's runtime_sha).
        required: true
        type: string
      dry_run:
        description: Build the release files and print the publish command without running it.
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_APP_ID:
        description: GitHub App that can write releases on the release repo.
        required: false
      RELEASE_APP_KEY:
        description: That App's private key.
        required: false
    outputs:
      tag:
        description: The runtime release tag, runtime-<sha>.
        value: ${{ jobs.check.outputs.tag }}
      published:
        description: "'true' when the release already existed and this run skipped it."
        value: ${{ jobs.check.outputs.published }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_REPO: MFB-Technologies-Inc/embed-pdf-runtime
  RUNTIME_SHA: ${{ inputs.runtime_sha }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.view.outputs.tag }}
      published: ${{ steps.view.outputs.published }}
    steps:
      # The release repo is public, so the run's own token can read it.
      - name: Look for the release
        id: view
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::runtime_sha must be a full commit sha, got '$RUNTIME_SHA'"; exit 1; }
          tag="runtime-$RUNTIME_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if err=$(gh release view "$tag" -R "$RELEASE_REPO" --json tagName 2>&1 >/dev/null); then
            echo "$tag is already published on $RELEASE_REPO; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qi 'release not found' <<<"$err"; then
            echo "$tag is not on $RELEASE_REPO yet."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            # Unknown (network, rate limit): don't act on a guess.
            echo "::error::gh couldn't say whether $tag exists on $RELEASE_REPO: $err"
            exit 1
          fi

  prepare:
    needs: check
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: the freshness report takes the merge base of <sha> and
      # upstream main, and write-manifest.sh reads HEAD for the sha it records.
      - uses: actions/checkout@v6
        with:
          repository: MFB-Technologies-Inc/embed-pdf-runtime
          ref: ${{ inputs.runtime_sha }}
          path: runtime-src
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream PDFium
        working-directory: runtime-src
        run: |
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags https://pdfium.googlesource.com/pdfium main:refs/remotes/upstream/main; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          echo "::error::could not fetch upstream PDFium main"
          exit 1

      - uses: actions/download-artifact@v7
        with:
          name: fork-slice-linux-arm64
          path: ${{ runner.temp }}/slices/linux-arm64
      - uses: actions/download-artifact@v7
        with:
          name: fork-slice-android-arm64
          path: ${{ runner.temp }}/slices/android-arm64
      - uses: actions/download-artifact@v7
        with:
          name: fork-slice-android-x64
          path: ${{ runner.temp }}/slices/android-x64
      - uses: actions/download-artifact@v7
        with:
          name: fork-slice-wasm32
          path: ${{ runner.temp }}/slices/wasm32
      - uses: actions/download-artifact@v7
        with:
          name: fork-slice-wasm32-eh
          path: ${{ runner.temp }}/slices/wasm32-eh

      # Each slice must be its own target at <sha>, with one archive named
      # for that commit (package-target.sh's --short sha, 7 or more digits).
      - name: Collect the archives
        run: |
          SLICES=$RUNNER_TEMP/slices
          OUT=$RUNNER_TEMP/runtime-release
          mkdir -p "$OUT/assets" "$OUT/gate"
          for target in linux-arm64 android-arm64 android-x64 wasm32 wasm32-eh; do
            dir="$SLICES/$target"
            meta="$dir/staging/BUILD-METADATA.json"
            test -f "$meta" || { echo "::error::$target: no staging/BUILD-METADATA.json"; exit 1; }
            read -r sha slice_target < <(jq -r '"\(.sha) \(.target)"' "$meta")
            if [[ "$sha" != "$RUNTIME_SHA" || "$slice_target" != "$target" ]]; then
              echo "::error::fork-slice-$target is $slice_target at $sha, not $target at $RUNTIME_SHA"
              exit 1
            fi
            archives=()
            for f in "$dir"/libembedpdf-runtime-"$target"-*.tar.gz; do
              short=${f##*/libembedpdf-runtime-"$target"-}
              short=${short%.tar.gz}
              if [[ "$short" =~ ^[0-9a-f]{7,40}$ && "$RUNTIME_SHA" == "$short"* ]]; then
                archives+=("$f")
              fi
            done
            if [[ ${#archives[@]} -ne 1 ]]; then
              echo "::error::fork-slice-$target: expected one libembedpdf-runtime-$target-<sha>.tar.gz, found ${#archives[@]}"
              ls -la "$dir"
              exit 1
            fi
            cp "${archives[0]}" "$OUT/assets/"
          done
          ls -la "$OUT/assets"

      # Without --enforce it only reports: the gate is the fork's own
      # release-libpdfium.yml, not this train.
      - name: Report upstream freshness
        working-directory: runtime-src
        run: |
          gate=$RUNNER_TEMP/runtime-release/gate
          python3 scripts/embedpdf-runtime/check-upstream-freshness.py \
            --json "$gate/upstream.json" --notes "$gate/notes.md"

      - name: Write the manifest
        working-directory: runtime-src
        env:
          PDF_RUNTIME_ARTIFACT_DIR: ${{ runner.temp }}/runtime-release/assets
          PDF_RUNTIME_RELEASE_BASE_URL: https://github.com/${{ env.RELEASE_REPO }}/releases/download/runtime-${{ inputs.runtime_sha }}
          PDF_RUNTIME_UPSTREAM_FILE: ${{ runner.temp }}/runtime-release/gate/upstream.json
        run: |
          test "$(git rev-parse HEAD)" = "$RUNTIME_SHA"
          manifest="$PDF_RUNTIME_ARTIFACT_DIR/pdf-runtime-build.generated.json"
          scripts/embedpdf-runtime/write-manifest.sh "$manifest"
          cat "$manifest"
          jq -e '.sha == env.RUNTIME_SHA and (.artifacts | keys | sort) == ["android-arm64","android-x64","linux-arm64","wasm32","wasm32-eh"]' "$manifest" >/dev/null \
            || { echo "::error::the manifest doesn't list exactly the five targets at $RUNTIME_SHA"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: runtime-release
          path: ${{ runner.temp }}/runtime-release/
          if-no-files-found: error

  publish:
    needs: [check, prepare]
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No environment on a dry run: nothing to approve.
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    env:
      TAG: ${{ needs.check.outputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: runtime-release
          path: ${{ runner.temp }}/runtime-release

      - name: Create the release token
        id: token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: MFB-Technologies-Inc
          repositories: embed-pdf-runtime

      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          OUT=$RUNNER_TEMP/runtime-release
          assets=()
          for target in linux-arm64 android-arm64 android-x64 wasm32 wasm32-eh; do
            assets+=("$OUT"/assets/libembedpdf-runtime-"$target"-*.tar.gz)
          done
          assets+=("$OUT/assets/pdf-runtime-build.generated.json")
          ls -la "${assets[@]}"
          args=(release create "$TAG" "${assets[@]}"
            --repo "$RELEASE_REPO"
            --target "$RUNTIME_SHA"
            --title "EmbedPDF PDF Runtime $RUNTIME_SHA"
            --notes-file "$OUT/gate/notes.md"
            --prerelease)
          if [[ "$DRY_RUN" == true ]]; then
            echo "dry run: would run gh $(printf '%q ' "${args[@]}")"
            echo "release notes:"
            cat "$OUT/gate/notes.md"
            exit 0
          fi
          gh "${args[@]}"
