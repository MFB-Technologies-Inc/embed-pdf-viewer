name: Set up Node and pnpm
description: >
  Install pnpm at the version in package.json packageManager, Node 24 with the
  pnpm store cached, and the workspace dependencies from the lockfile.

runs:
  using: composite
  steps:
    # No `version` input: pnpm/action-setup reads packageManager from the root
    # package.json, so the pin lives in one place.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        run_install: false

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
